<!DOCTYPE html>
<html lang="%{lang}">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, follow" />
	<title>%{page-title}</title>
	<link rel="stylesheet" type="text/css" href="/theme/style.css" />
</head>
<body>
	<header>
		<img class="logo-icon" src="/theme/logo/light-inline.svg" />
		<h1>%{title}</h1>
		<span class="userbox">
			%{user-link}
			<img src="%{avatar}" />
		</span>
	</header>

	<div class="page-wrapper">
		<nav>
			<h1>%{HOSTNAME}</h1>
			%{navbar}
		</nav>

		<!-- The primary content unique to this specific page -->
		<main>
			<!-- Static Page Summary: Gives a quick overview of the unique page content -->
			<!-- section class="system-state" aria-label="system-state">
				%{page-summary}
			</section -->
			%{page-contents}
		</main>
	</div>

	<!-- aside></aside -->
	<!-- footer></footer -->
</body>
</html>
